[project]
name = "mbuu"
version = "1.0.0"
description = "Mbuu - Python CLI for car-dealership management (SQLAlchemy ORM)"
requires-python = ">=3.10"

[tool.ruff]
line-length = 100
extend-exclude = ["lib/db/migrations"]

[tool.ruff.lint]
select = ["E", "W", "F", "I", "UP", "B"]
ignore = ["E501"]

[tool.pytest.ini_options]
testpaths = ["tests"]
